<!-- pricing.component.html -->
<section class="bg-white text-center py-24">
  <div class="max-w-5xl mx-auto px-6 space-y-6">
    <p class="text-sm tracking-widest text-blue-600 font-semibold">SIMPLE & CLEAR PRICING</p>
    <h1 class="text-4xl md:text-6xl font-bold leading-tight text-gray-900">
      Pricing that supports your compliance goals
    </h1>
    <p class="text-lg md:text-xl text-gray-600 max-w-2xl mx-auto">
      Practical ISO 27001 services designed to help organizations achieve certification readiness efficiently.
    </p>
  </div>
</section>

<section class="bg-gray-50 py-16">
  <div class="max-w-7xl mx-auto px-6 grid gap-10 grid-cols-1 md:grid-cols-3">
    <div *ngFor="let plan of pricingPlans" class="bg-white rounded-xl shadow-lg p-8 border border-gray-200 flex flex-col h-full">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">{{ plan.title }}</h2>
      <p class="text-4xl font-extrabold text-blue-600 mb-4">{{ plan.price }}</p>
      <ul class="space-y-3 text-gray-700 mb-6">
        <li *ngFor="let feature of plan.features">{{ feature }}</li>
      </ul>
      <div class="mt-auto">
        <button
          [routerLink]="plan.route"
          class="bg-blue-600 text-white w-full py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
        >
          {{ plan.cta }}
        </button>
      </div>
    </div>
  </div>
</section>
